<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Notes PWA</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#4e54c8">
    <meta name="description" content="A simple, premium note-taking application with offline support.">
</head>
<body>
    <div class="bg-gradient"></div>
    <main class="container">
        <section class="glass-card">
            <header>
                <h1>✨ Мои Заметки</h1>
                <p>Ваше первое офлайн-приложение</p>
            </header>
            
            <form id="note-form" class="row">
                <div class="col-9">
                    <input type="text" id="note-input" placeholder="Введите новую заметку..." required autocomplete="off">
                </div>
                <div class="col-3">
                    <button class="button primary full-width" type="submit">Добавить</button>
                </div>
            </form>

            <div class="notes-container">
                <ul id="notes-list"></ul>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
