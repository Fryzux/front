<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки (13-18)</title>
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Для Android -->
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Цвет темы для браузера -->
    <meta name="theme-color" content="#4285f4">
    
    <!-- Для iOS (иконка на домашний экран) -->
    <link rel="apple-touch-icon" href="icons/icon-152x152.png">
    
    <!-- Для iOS (статус бар) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/favicon.ico" sizes="16x16" type="image/ico">
    <meta name="description" content="Простое приложение для заметок, работающее офлайн">
</head>
<body>
    <div class="bg-gradient"></div>
    <main class="container">
        <section class="glass-card">
            <header>
                <h1>✨ Мои Заметки</h1>
                <p>Ваше первое офлайн-приложение (PWA)</p>
            </header>
            
            <form id="note-form" class="row">
                <div class="col-9">
                    <input type="text" id="note-input" placeholder="Введите новую заметку..." required autocomplete="off">
                </div>
                <div class="col-3">
                    <button class="button primary full-width" type="submit">Добавить</button>
                </div>
            </form>

            <div class="notes-container">
                <ul id="notes-list"></ul>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
