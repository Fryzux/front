<div class="home-content">
    <h2 class="is-center">📝 Новая заметка</h2>
    <p class="is-center text-grey">Введите текст и нажмите кнопку «Добавить», чтобы сохранить заметку.</p>
    
    <form id="note-form" class="row is-center">
        <input class="col-9" type="text" id="note-input" placeholder="Введите текст заметки..." required autocomplete="off">
        <button class="col-3 button primary" type="submit">Добавить</button>
    </form>

    <h2 class="is-center" style="margin-top: 3rem;">📔 Список заметок</h2>
    <ul id="notes-list" style="list-style: none; padding-left: 0;">
        <!-- Сюда будут загружаться заметки -->
    </ul>
</div>
