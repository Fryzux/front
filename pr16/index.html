<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки (WebSocket + Push)</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4285f4">
    <link rel="apple-touch-icon" href="icons/icon-152x152.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/favicon.ico" sizes="16x16" type="image/ico">
</head>
<body>
    <div class="bg-gradient"></div>
    <main class="container">
        <section class="glass-card">
            <header>
                <h1>🚀 Мои Заметки</h1>
                <p>Ваше приложение теперь еще быстрее (App Shell)</p>
                
                <nav class="tabs is-center" style="margin-top: 1.5rem;">
                    <button id="home-btn" class="tab active col-6">🏠 Главная</button>
                    <button id="about-btn" class="tab col-6">📦 О нас</button>
                </nav>
            </header>
            
            <!-- Динамический контейнер -->
            <div id="app-content" style="margin-top: 2rem;">
                <!-- Сюда подгружается home.html или about.html -->
                <div class="is-center">Загрузка интерфейса...</div>
            </div>
        </section>
        <footer class="is-center" style="margin-top: 2rem;">
            <button id="enable-push" class="button success">Включить уведомления</button>
            <button id="disable-push" class="button error" style="display:none;">Отключить уведомления</button>
        </footer>
    </main>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
