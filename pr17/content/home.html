<div class="home-content">
    <div class="form-container">
        <label class="section-label">Новая заметка</label>
        <form id="note-form" class="form-row">
            <input type="text" id="note-input" placeholder="Перейти в магазин..." required autocomplete="off">
            <button class="button primary" type="submit">Добавить</button>
        </form>
    </div>

    <hr class="separator">

    <div class="form-container">
        <label class="section-label">С напоминанием</label>
        <form id="reminder-form" style="display: flex; flex-direction: column; gap: 8px;">
            <input type="text" id="reminder-text" placeholder="Забрать посылку" required autocomplete="off">
            <div style="display: flex; gap: 8px;">
                <input type="datetime-local" id="reminder-time" required style="flex-grow: 1;">
                <button class="button ghost" type="submit">Напомнить</button>
            </div>
        </form>
    </div>

    <hr class="separator">

    <div class="list-title">Список заметок <span id="note-count" class="count-badge">0</span></div>
    <ul id="notes-list" class="notes-list">
        <li class="empty-state">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.15; margin-bottom: 12px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <br>
            Заметок пока нет — добавьте первую выше
        </li>
    </ul>
</div>
