<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заметки</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#534AB7">
    <link rel="apple-touch-icon" href="icons/icon-152x152.png">
    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=3">
    <link rel="icon" href="icons/favicon.ico" sizes="16x16" type="image/ico">
</head>
<body>
    <main class="container">
        <section class="glass-card">
            <header class="app-header">
                <div class="branding">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    Мои заметки
                </div>
                <nav class="pill-nav">
                    <button id="home-btn" class="active">Главная</button>
                    <button id="about-btn">О нас</button>
                </nav>
            </header>
            
            <!-- Динамический контейнер -->
            <div id="app-content">
                <div class="empty-state">Загрузка интерфейса...</div>
            </div>

            <footer id="push-footer">
                <button id="enable-push" class="button secondary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    Уведомления
                </button>
                <button id="disable-push" class="button secondary" style="display:none;">
                    Отключить
                </button>
            </footer>
        </section>
    </main>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
