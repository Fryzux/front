#────────────────────────────────────────────────────────────────
# PR22 — HAProxy как балансировщик нагрузки
# Принимает трафик на порту 9090 и распределяет между 3 серверами
#────────────────────────────────────────────────────────────────

global
    log         stdout format raw local0 info
    maxconn     4096
    daemon

defaults
    log         global
    mode        http
    option      httplog
    option      dontlognull
    option      forwardfor        # добавляет X-Forwarded-For
    option      http-server-close
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries     3

#────────────────────────────────────────────────────────────────
# Frontend — принимает входящие подключения
#────────────────────────────────────────────────────────────────
frontend http_front
    bind *:9090
    default_backend nodejs_servers

#────────────────────────────────────────────────────────────────
# Backend — пул Node.js-серверов
# Алгоритм: roundrobin (можно заменить на leastconn / source)
#────────────────────────────────────────────────────────────────
backend nodejs_servers
    balance     roundrobin

    # Healthcheck: каждые 5 секунд GET /api/health
    option      httpchk GET /api/health
    http-check  expect status 200

    server  server1  127.0.0.1:3031  check inter 5s fall 3 rise 2
    server  server2  127.0.0.1:3032  check inter 5s fall 3 rise 2
    server  server3  127.0.0.1:3033  check inter 5s fall 3 rise 2

#────────────────────────────────────────────────────────────────
# Statistics — веб-интерфейс мониторинга HAProxy
# Открыть в браузере: http://localhost:9091/stats
#────────────────────────────────────────────────────────────────
frontend stats
    bind *:9091
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-node
    stats auth admin:admin123
