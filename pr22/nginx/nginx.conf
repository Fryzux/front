# ─────────────────────────────────────────────────────────────
# PR22 — Nginx как балансировщик нагрузки
# Распределяет запросы между 3 Node.js-серверами (round-robin)
# ─────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # ── Upstream: пул Node.js-серверов ──────────────────────
    upstream nodejs_cluster {
        # Алгоритм: round-robin (по умолчанию)
        # Альтернативы: least_conn; / ip_hash;

        server 127.0.0.1:3031 max_fails=3 fail_timeout=30s;   # server-1
        server 127.0.0.1:3032 max_fails=3 fail_timeout=30s;   # server-2
        server 127.0.0.1:3033 max_fails=3 fail_timeout=30s;   # server-3
    }

    # ── Логирование ─────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$upstream_addr" upstream_time=$upstream_response_time';

    access_log /var/log/nginx/pr22_access.log main;
    error_log  /var/log/nginx/pr22_error.log warn;

    # ── Виртуальный хост ────────────────────────────────────
    server {
        listen 8080;
        server_name localhost;

        # Передаём реальный IP клиента в заголовках
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header Host             $http_host;

        # Таймауты
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # ── API проксируется на кластер Node.js ─────────────
        location /api/ {
            proxy_pass http://nodejs_cluster;
        }

        # ── Статус Nginx ─────────────────────────────────────
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }

        # ── 404 ──────────────────────────────────────────────
        location / {
            default_type application/json;
            return 404 '{"error":"Not found via Nginx"}';
        }
    }
}
