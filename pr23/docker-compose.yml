version: "3.8"

services:
  # Backend сервис 1
  backend1:
    build: ./backend1
    environment:
      SERVER_ID: backend-1
      PORT: 3000
      NODE_ENV: production
    networks:
      - app-network
    restart: unless-stopped

  # Backend сервис 2
  backend2:
    build: ./backend2
    environment:
      SERVER_ID: backend-2
      PORT: 3000
      NODE_ENV: production
    networks:
      - app-network
    restart: unless-stopped

  # Nginx балансировщик нагрузки
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - backend1
      - backend2
    restart: unless-stopped

# Общая сеть для всех сервисов
networks:
  app-network:
    driver: bridge
