# Docker PR23 — Nginx как балансировщик нагрузки

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstream: пул backend-сервисов в Docker сети
    upstream backend_cluster {
        # Используем имена сервисов из docker-compose.yml
        # Docker автоматически разрешает их в IP-адреса контейнеров
        server backend1:3000 max_fails=2 fail_timeout=10s;
        server backend2:3000 max_fails=2 fail_timeout=10s;
    }

    # Логирование
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$upstream_addr" upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Виртуальный хост
    server {
        listen 80;
        server_name localhost;

        # Передаём информацию о клиенте
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header Host             $http_host;

        # Таймауты
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Проксируем все запросы на backend_cluster
        location / {
            proxy_pass http://backend_cluster;
        }

        # Статус Nginx
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }
    }
}
